<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CCTV Mobile Optical Node</title>
  <link rel="stylesheet" href="css/camera.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- Fullscreen Camera Viewfinder -->
  <div class="viewfinder-wrapper">
    <video id="mobile-video" autoplay playsinline muted></video>
    <div class="mobile-hud-overlay"></div>
    <div class="viewfinder-frame"></div>

    <!-- Top Status Header -->
    <div class="camera-header">
      <div class="status-pill">
        <span class="pulse-dot" id="pulse-indicator"></span>
        <span id="stream-status-text">INITIALIZING NODE...</span>
      </div>
      <div class="fps-counter" id="fps-counter">0 FPS</div>
    </div>

    <!-- Bottom Controls -->
    <div class="camera-footer">
      <button class="btn-ctrl" id="btn-switch-cam" title="Switch Lens">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 16v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/>
          <path d="M4 8V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/>
          <polyline points="16 12 12 8 8 12"/>
          <polyline points="8 12 12 16 16 12"/>
        </svg>
      </button>

      <button class="btn-ctrl" id="btn-torch" title="Flashlight">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Permissions / Activation Modal -->
  <div class="permission-modal" id="permission-modal">
    <div class="modal-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>
    <h2 class="modal-title">Connect Mobile Optical Sensor</h2>
    <p class="modal-desc">
      Pairing this smartphone with the AI CCTV Command Center. Please grant camera permission to stream real-time video and telemetry.
    </p>
    <button class="btn-start" id="btn-start-stream">Activate Optical Transmission</button>
  </div>

  <script src="js/camera-streamer.js"></script>
</body>
</html>
