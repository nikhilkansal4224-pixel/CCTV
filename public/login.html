<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTINEL // Operator Authentication Portal</title>
  <meta name="description" content="Secure clearance login for Sentinel CCTV Host Monitor & P2P Camera Gateway.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">

  <div class="login-backdrop-glow"></div>

  <main class="login-container">
    <div class="login-card">
      
      <!-- Brand Header -->
      <div class="login-header">
        <div class="brand-icon" style="width: 44px; height: 44px; margin: 0 auto 1rem auto;">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h1 class="login-title">SENTINEL GATEWAY</h1>
        <p class="login-subtitle">Host Monitor & Surveillance Clearance Portal</p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" type="button">Sign In</button>
        <button class="auth-tab" id="tabRegister" type="button">Register Operator</button>
      </div>

      <!-- Alert Box -->
      <div id="authAlert" class="auth-alert" style="display: none;"></div>

      <!-- Login Form -->
      <form id="formLogin" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="loginUsername">Operator Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <input type="text" id="loginUsername" class="form-input" placeholder="Enter username" required autofocus value="admin">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Access Key / Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
            <input type="password" id="loginPassword" class="form-input" placeholder="Enter password" required value="password123">
            <button type="button" class="btn-toggle-pwd" id="toggleLoginPwd" tabindex="-1" title="Show/Hide Password">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-row-remember">
          <label class="checkbox-label">
            <input type="checkbox" id="loginRemember" checked>
            <span>Remember session on this device</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnLoginSubmit">
          <span>Authorize Access</span>
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>

        <!-- Quick Demo Hint -->
        <div class="login-credentials-hint">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>Default Operator: <strong>admin</strong> / <strong>password123</strong></span>
        </div>
      </form>

      <!-- Register Form -->
      <form id="formRegister" class="auth-form" style="display: none;" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="regUsername">Choose Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <input type="text" id="regUsername" class="form-input" placeholder="e.g. officer_john" required minlength="3">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regDisplayName">Full Name or Call-Sign</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <input type="text" id="regDisplayName" class="form-input" placeholder="e.g. John Doe">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regRole">Operator Clearance Level</label>
          <div class="input-wrapper">
            <select id="regRole" class="custom-select" style="padding-left: 2.75rem;">
              <option value="Security Operator" selected>Security Operator</option>
              <option value="Surveillance Supervisor">Surveillance Supervisor</option>
              <option value="Chief Security Officer">Chief Security Officer</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Security Passphrase</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input type="password" id="regPassword" class="form-input" placeholder="Minimum 6 characters" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnRegisterSubmit">
          <span>Create Operator Profile</span>
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
        </button>
      </form>

      <!-- Security Guarantee Footer -->
      <div class="login-footer-security">
        <div class="security-chip">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
          <span>PBKDF2 SHA-512 Encrypted Clearance</span>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/webrtc-common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
